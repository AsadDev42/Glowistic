<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F7F3"/><stop offset="100%" stop-color="#E8ECE1"/>
    </linearGradient>
    <pattern id="dotPattern" x1="0" y1="0" x2="24" y2="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#500F17" opacity="0.06"/>
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#500F17" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#dotPattern)" />

  <!-- Soft Decorative Ambient Spheres -->
  <circle cx="1020" cy="180" r="280" fill="#500F17" opacity="0.04" />
  <circle cx="150" cy="520" r="220" fill="#D4AF37" opacity="0.06" />

  <!-- Central Editorial Frame -->
  <g transform="translate(80, 75)">
    <!-- Brand Banner Tag -->
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#500F17" opacity="0.1" />
    <text x="80" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#500F17" text-anchor="middle" letter-spacing="1.5">HAIR & SCALP</text>

    <!-- Editorial Title -->
    <text x="0" y="90" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#2C080E" letter-spacing="-0.5">
      Simple Habits for Healthier Hair
    </text>

    <!-- Subtitle / Context -->
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#6B5E5F" font-weight="400">
      Scalp wellness, botanical nutrition & everyday root strength
    </text>

    <!-- Editorial Divider -->
    <line x1="0" y1="165" x2="180" y2="165" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Graphic Showcase Illustration Area -->
  <g transform="translate(740, 200)" filter="url(#cardShadow)">
    <rect x="-30" y="-30" width="400" height="400" rx="32" fill="#FFFFFF" fill-opacity="0.9" stroke="#500F17" stroke-opacity="0.08" stroke-width="1.5" />
    
    <!-- Hair Strand Flow & Rosemary Leaves -->
    <g transform="translate(60, 45)">
      <!-- Hair Strands Flow -->
      <path d="M70 40 Q130 140 70 240 Q150 280 160 330" stroke="#500F17" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8" />
      <path d="M100 40 Q160 140 100 240 Q180 280 190 330" stroke="#D4AF37" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
      <path d="M130 40 Q190 140 130 240 Q210 280 220 330" stroke="#500F17" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4" />
      <!-- Botanical Rosemary Branch -->
      <path d="M180 80 L180 260" stroke="#385E38" stroke-width="3" />
      <ellipse cx="165" cy="110" rx="14" ry="5" transform="rotate(-30 165 110)" fill="#4A7C59" />
      <ellipse cx="195" cy="130" rx="14" ry="5" transform="rotate(30 195 130)" fill="#4A7C59" />
      <ellipse cx="165" cy="160" rx="14" ry="5" transform="rotate(-30 165 160)" fill="#4A7C59" />
      <ellipse cx="195" cy="180" rx="14" ry="5" transform="rotate(30 195 180)" fill="#4A7C59" />
      <ellipse cx="165" cy="210" rx="14" ry="5" transform="rotate(-30 165 210)" fill="#4A7C59" />
    </g>
  
  </g>

  <!-- Glow Journal Footer Watermark -->
  <g transform="translate(80, 595)">
    <text font-family="'Playfair Display', Georgia, serif" font-size="17" font-weight="700" fill="#500F17" letter-spacing="1">GLOWISTIC</text>
    <text x="110" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#8C7A7B">| The Glow Journal &bull; Everyday Care Essentials</text>
  </g>
</svg>