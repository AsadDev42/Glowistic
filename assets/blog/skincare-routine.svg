<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F4"/><stop offset="100%" stop-color="#F4ECE6"/>
    </linearGradient>
    <pattern id="dotPattern" x1="0" y1="0" x2="24" y2="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#500F17" opacity="0.06"/>
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#500F17" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#dotPattern)" />

  <!-- Soft Decorative Ambient Spheres -->
  <circle cx="1020" cy="180" r="280" fill="#500F17" opacity="0.04" />
  <circle cx="150" cy="520" r="220" fill="#D4AF37" opacity="0.06" />

  <!-- Central Editorial Frame -->
  <g transform="translate(80, 75)">
    <!-- Brand Banner Tag -->
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#500F17" opacity="0.1" />
    <text x="80" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#500F17" text-anchor="middle" letter-spacing="1.5">SKINCARE GUIDE</text>

    <!-- Editorial Title -->
    <text x="0" y="90" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#2C080E" letter-spacing="-0.5">
      How to Build a Simple Skincare Routine
    </text>

    <!-- Subtitle / Context -->
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#6B5E5F" font-weight="400">
      Gentle cleansing, targeted hydration & lasting barrier balance
    </text>

    <!-- Editorial Divider -->
    <line x1="0" y1="165" x2="180" y2="165" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Graphic Showcase Illustration Area -->
  <g transform="translate(740, 200)" filter="url(#cardShadow)">
    <rect x="-30" y="-30" width="400" height="400" rx="32" fill="#FFFFFF" fill-opacity="0.9" stroke="#500F17" stroke-opacity="0.08" stroke-width="1.5" />
    
    <!-- Skincare Dropper & Droplets Illustration -->
    <g transform="translate(80, 40)">
      <!-- Serum Bottle Silhouette -->
      <rect x="40" y="100" width="100" height="170" rx="20" fill="#500F17" opacity="0.1" />
      <rect x="50" y="110" width="80" height="150" rx="14" fill="#500F17" opacity="0.85" />
      <!-- Bottle neck -->
      <rect x="72" y="70" width="36" height="30" rx="4" fill="#D4AF37" />
      <rect x="80" y="40" width="20" height="30" rx="6" fill="#FFFFFF" stroke="#D4AF37" stroke-width="3" />
      <!-- Dropper pipet -->
      <path d="M90 20 L90 40" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <circle cx="90" cy="18" r="10" fill="#500F17" />
      <!-- Active Droplet -->
      <path d="M90 285 C80 300 70 315 70 330 C70 345 80 355 90 355 C100 355 110 345 110 330 C110 315 100 300 90 285 Z" fill="#D4AF37" opacity="0.9" />
      <!-- Botanical Leaf Sprig -->
      <path d="M160 180 Q190 140 220 150 Q210 180 170 190 Z" fill="#4A7C59" opacity="0.8" />
      <path d="M165 210 Q200 210 215 235 Q185 245 160 220 Z" fill="#4A7C59" opacity="0.6" />
      <path d="M150 240 Q155 190 160 170" stroke="#4A7C59" stroke-width="2.5" fill="none" />
    </g>
  
  </g>

  <!-- Glow Journal Footer Watermark -->
  <g transform="translate(80, 595)">
    <text font-family="'Playfair Display', Georgia, serif" font-size="17" font-weight="700" fill="#500F17" letter-spacing="1">GLOWISTIC</text>
    <text x="110" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#8C7A7B">| The Glow Journal &bull; Everyday Care Essentials</text>
  </g>
</svg>