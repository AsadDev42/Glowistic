<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F5F1"/><stop offset="100%" stop-color="#EFE7DF"/>
    </linearGradient>
    <pattern id="dotPattern" x1="0" y1="0" x2="24" y2="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#500F17" opacity="0.06"/>
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#500F17" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#dotPattern)" />

  <!-- Soft Decorative Ambient Spheres -->
  <circle cx="1020" cy="180" r="280" fill="#500F17" opacity="0.04" />
  <circle cx="150" cy="520" r="220" fill="#D4AF37" opacity="0.06" />

  <!-- Central Editorial Frame -->
  <g transform="translate(80, 75)">
    <!-- Brand Banner Tag -->
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#500F17" opacity="0.1" />
    <text x="80" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#500F17" text-anchor="middle" letter-spacing="1.5">PERSONAL CARE</text>

    <!-- Editorial Title -->
    <text x="0" y="90" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#2C080E" letter-spacing="-0.5">
      Choosing Personal Care for Your Routine
    </text>

    <!-- Subtitle / Context -->
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#6B5E5F" font-weight="400">
      Honest labels, skin-friendly formulas & conscious essentials
    </text>

    <!-- Editorial Divider -->
    <line x1="0" y1="165" x2="180" y2="165" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Graphic Showcase Illustration Area -->
  <g transform="translate(740, 200)" filter="url(#cardShadow)">
    <rect x="-30" y="-30" width="400" height="400" rx="32" fill="#FFFFFF" fill-opacity="0.9" stroke="#500F17" stroke-opacity="0.08" stroke-width="1.5" />
    
    <!-- Curated Personal Care Bottles & Botanicals -->
    <g transform="translate(60, 50)">
      <!-- Pump Bottle -->
      <rect x="30" y="110" width="80" height="160" rx="16" fill="#500F17" opacity="0.8" />
      <rect x="58" y="80" width="24" height="30" fill="#D4AF37" />
      <!-- Pump head -->
      <path d="M70 80 L70 50 L110 50" stroke="#500F17" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- Cream Jar -->
      <rect x="130" y="160" width="100" height="110" rx="14" fill="#FFFFFF" stroke="#500F17" stroke-width="3" />
      <rect x="125" y="145" width="110" height="20" rx="6" fill="#D4AF37" />
      <!-- Gentle Bubbles / Foam -->
      <circle cx="180" cy="115" r="14" fill="#500F17" opacity="0.08" />
      <circle cx="160" cy="95" r="10" fill="#500F17" opacity="0.06" />
      <circle cx="205" cy="100" r="8" fill="#500F17" opacity="0.05" />
      <circle cx="140" cy="130" r="7" fill="#D4AF37" opacity="0.2" />
    </g>
  
  </g>

  <!-- Glow Journal Footer Watermark -->
  <g transform="translate(80, 595)">
    <text font-family="'Playfair Display', Georgia, serif" font-size="17" font-weight="700" fill="#500F17" letter-spacing="1">GLOWISTIC</text>
    <text x="110" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#8C7A7B">| The Glow Journal &bull; Everyday Care Essentials</text>
  </g>
</svg>